[project]
name = "open-career"
version = "0.1.0"
description = "Local-first job-application system: career graph backend, CLI, and a fill-and-stop browser extension."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "playwright>=1.62.0",
]

[project.scripts]
open-career = "apps.cli.main:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/domain", "packages/prompts", "apps", "adapters"]

[tool.hatch.build.targets.wheel.force-include]
# migrations/ stays the human-facing home at the repo root; the wheel carries a
# copy the runner falls back to when no checkout is present.
"migrations" = "adapters/storage/_migrations"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
